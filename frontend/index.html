<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asta — Personal AI Assistant</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

<div class="app">

    <!-- ====================================================
         SIDEBAR
         ==================================================== -->

    <aside class="sidebar">

        <div>

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    A
                </div>

                <div>

                    <h2>Asta</h2>

                    <span>
                        Personal AI
                    </span>

                </div>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat"
                onclick="newChat()"
            >

                <span>＋</span>

                New Chat

            </button>


            <!-- SIDEBAR SECTION -->

            <div class="sidebar-section">

                <p class="section-title">
                    Assistant
                </p>


                <button
                    class="side-button"
                    onclick="showMemory()"
                >
                    🧠 Memory
                </button>


                <button
                    class="side-button"
                    onclick="showSystemStatus()"
                >
                    ⚡ System Status
                </button>

            </div>

        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <div class="model-card">

                <span
                    class="status-dot"
                ></span>

                <div>

                    <strong>
                        Gemini 2.5 Flash
                    </strong>

                    <small>
                        Cloud AI • Asta
                    </small>

                </div>

            </div>

        </div>

    </aside>


    <!-- ====================================================
         MAIN AREA
         ==================================================== -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <strong>
                    Asta
                </strong>

                <span
                    class="online"
                    id="systemStatus"
                >
                    ● Checking...
                </span>

            </div>


            <span class="model-name">

                Gemini 2.5 Flash

            </span>

        </header>


        <!-- =================================================
             CHAT AREA
             ================================================= -->

        <div
            id="chat-box"
            class="chat-box"
        >

            <!-- WELCOME -->

            <div
                id="welcomeScreen"
                class="welcome"
            >

                <div class="asta-logo">
                    A
                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    I'm Asta, your personal AI assistant.
                </p>


                <!-- SUGGESTIONS -->

                <div class="suggestions">


                    <button
                        onclick="useSuggestion('Explain Python from basics')"
                    >

                        🐍 Explain Python from basics

                    </button>


                    <button
                        onclick="useSuggestion('Help me learn DSA')"
                    >

                        💻 Help me learn DSA

                    </button>


                    <button
                        onclick="useSuggestion('Give me a data science project idea')"
                    >

                        📊 Data science project

                    </button>


                    <button
                        onclick="useSuggestion('What can you help me with?')"
                    >

                        ✨ What can you do?

                    </button>


                </div>

            </div>

        </div>


        <!-- =================================================
             INPUT AREA
             ================================================= -->

        <div class="input-wrapper">


            <div class="input-area">


                <textarea
                    id="message"
                    rows="1"
                    placeholder="Message Asta..."
                    onkeydown="handleKey(event)"
                ></textarea>


                <button
                    id="send-button"
                    onclick="sendMessage()"
                    aria-label="Send"
                >

                    ➤

                </button>


            </div>


            <p class="disclaimer">

                Asta can make mistakes.
                Check important information.

            </p>


        </div>


    </main>

</div>


<!-- ========================================================
     MEMORY MODAL
     ======================================================== -->

<div
    id="memory-modal"
    class="modal hidden"
>

    <div class="modal-content">


        <div class="modal-header">

            <h2>
                🧠 Asta Memory
            </h2>


            <button
                onclick="closeMemory()"
            >
                ×
            </button>

        </div>


        <div id="memory-list">

            Loading...

        </div>


        <button
            class="clear-memory"
            onclick="clearMemory()"
        >

            Clear Long-Term Memory

        </button>


    </div>

</div>


<!-- ========================================================
     JAVASCRIPT
     ======================================================== -->

<script src="/script.js"></script>

</body>

</html>
