<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asta AI Assistant</title>

    <link
        rel="stylesheet"
        href="/style.css?v=3"
    >
</head>

<body>

<div class="app">

    <!-- =========================================================
         SIDEBAR
         ========================================================= -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="brand">
                <div class="brand-logo">A</div>

                <div>
                    <h2>Asta</h2>
                    <span>AI Assistant</span>
                </div>
            </div>

        </div>


        <!-- New Chat -->

        <button
            class="new-chat"
            onclick="newChat()"
        >
            <span>＋</span>
            <span>New Chat</span>
        </button>


        <!-- Sidebar Menu -->

        <div class="sidebar-menu">

            <button
                class="side-button"
                onclick="showMemory()"
            >
                <span>🧠</span>
                <span>Memory</span>
            </button>


            <button
                class="side-button"
                onclick="showSystemStatus()"
            >
                <span>⚡</span>
                <span>System Status</span>
            </button>

        </div>


        <!-- Spacer -->

        <div class="sidebar-spacer"></div>


        <!-- Model Card -->

        <div class="model-card">

            <div class="model-icon">
                ✦
            </div>

            <div class="model-info">

                <strong>
                    Gemini 2.5 Flash
                </strong>

                <small>
                    Cloud AI
                </small>

            </div>

        </div>


        <!-- Sidebar Footer -->

        <div class="sidebar-footer">

            <span>
                Asta AI
            </span>

            <span>
                v1.0
            </span>

        </div>

    </aside>



    <!-- =========================================================
         MAIN CHAT AREA
         ========================================================= -->

    <main class="main">


        <!-- Top Bar -->

        <header class="topbar">

            <div class="topbar-left">

                <div class="topbar-title">

                    <strong>
                        Asta
                    </strong>

                    <span
                        class="online"
                        id="systemStatus"
                    >
                        ● Online
                    </span>

                </div>

            </div>


            <div class="topbar-right">

                <span class="model-name">
                    Gemini 2.5 Flash
                </span>

            </div>

        </header>



        <!-- =====================================================
             CHAT BOX
             ===================================================== -->

        <div
            id="chat-box"
            class="chat-box"
        >


            <!-- =================================================
                 WELCOME SCREEN
                 ================================================= -->

            <div
                id="welcomeScreen"
                class="welcome"
            >

                <div class="asta-logo">
                    A
                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    I'm Asta, your personal AI assistant.
                </p>



                <!-- Suggestions -->

                <div class="suggestions">


                    <button
                        onclick="useSuggestion('Explain Python from basics')"
                    >

                        <span class="suggestion-icon">
                            🐍
                        </span>

                        <span>
                            Explain Python from basics
                        </span>

                    </button>



                    <button
                        onclick="useSuggestion('Help me learn DSA')"
                    >

                        <span class="suggestion-icon">
                            💻
                        </span>

                        <span>
                            Help me learn DSA
                        </span>

                    </button>



                    <button
                        onclick="useSuggestion('Give me a data science project idea')"
                    >

                        <span class="suggestion-icon">
                            📊
                        </span>

                        <span>
                            Give me a data science project idea
                        </span>

                    </button>



                    <button
                        onclick="useSuggestion('What can you help me with?')"
                    >

                        <span class="suggestion-icon">
                            ✨
                        </span>

                        <span>
                            What can you help me with?
                        </span>

                    </button>

                </div>

            </div>

        </div>



        <!-- =====================================================
             INPUT AREA
             ===================================================== -->

        <div class="input-wrapper">

            <div class="input-area">


                <textarea
                    id="message"
                    rows="1"
                    placeholder="Message Asta..."
                    autocomplete="off"
                    spellcheck="true"
                    onkeydown="handleKey(event)"
                ></textarea>



                <button
                    id="send-button"
                    type="button"
                    onclick="sendMessage()"
                    aria-label="Send message"
                    title="Send message"
                >
                    ➤
                </button>

            </div>


            <p class="disclaimer">
                Asta can make mistakes. Check important information.
            </p>

        </div>

    </main>

</div>



<!-- =============================================================
     MEMORY MODAL
     ============================================================= -->

<div
    id="memory-modal"
    class="modal hidden"
>

    <div class="modal-content">


        <div class="modal-header">

            <h2>
                🧠 Asta Memory
            </h2>


            <button
                type="button"
                onclick="closeMemory()"
                aria-label="Close memory"
            >
                ×
            </button>

        </div>



        <div id="memory-list">

            Loading...

        </div>



        <button
            class="clear-memory"
            type="button"
            onclick="clearMemory()"
        >
            Clear Long-Term Memory
        </button>

    </div>

</div>



<!-- =============================================================
     JAVASCRIPT
     
     IMPORTANT:
     The script is loaded AFTER the complete HTML so that all
     elements such as #chat-box and #message already exist.
     ============================================================= -->

<script src="/script.js?v=3"></script>

</body>
</html>
